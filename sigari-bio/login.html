<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sigari.bio · Claim your @</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --s1:#0d0d0d; --b:#333; --m:#9a9a9a; --d:#5c5c5c; --int:0.08; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body { background:#000; color:#fff; font-family:"Geist","Inter",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  button, input { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* Lava lamp background */
  .lava { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; background:#000; }
  .blob { position:absolute; border-radius:50%; background:#fff; opacity:var(--int); filter:blur(80px); animation:drift 38s ease-in-out infinite alternate; }
  .blob:nth-child(1){ width:420px; height:420px; left:-80px; top:-60px; background:#e8e8e8; }
  .blob:nth-child(2){ width:520px; height:520px; right:-120px; top:30%; background:#9a9a9a; animation-duration:46s; animation-delay:-8s; }
  .blob:nth-child(3){ width:360px; height:360px; left:30%; bottom:-120px; animation-duration:52s; animation-delay:-20s; }
  .blob:nth-child(4){ width:300px; height:300px; left:55%; top:10%; background:#6e6e6e; animation-duration:44s; animation-delay:-14s; }
  @keyframes drift { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(120px,-80px) scale(1.1)} 100%{transform:translate(-60px,100px) scale(.92)} }

  /* Page: content scrolls normally, footer sits at the bottom of the flow */
  .auth { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 20px 32px; }
  .wrap { width:100%; max-width:525px; }
  .logo { display:block; width:max-content; margin:0 auto; font-size:22px; font-weight:600; letter-spacing:-0.02em; text-align:center; color:#fff; text-decoration:none; }
  .back { display:inline-flex; gap:6px; align-items:center; margin-top:28px; color:var(--d); font-size:13px; text-decoration:none; transition:color .2s; }
  .back:hover { color:#fff; }
  .logo span { color:#666; }
  h1 { font-size:clamp(40px,9vw,56px); font-weight:700; letter-spacing:-0.05em; margin-top:18px; line-height:1; }
  .sub { color:var(--m); font-size:15px; margin-top:10px; }
  .sub a { color:#fff; text-decoration:underline; cursor:pointer; }

  .social { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:28px; }
  .btn-ghost { height:52px; border-radius:12px; border:1px solid var(--b); background:var(--s1); display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; transition:background .2s,border-color .2s; font-size:15px; }
  .btn-ghost:hover { background:#161616; border-color:#444; }
  .btn-ghost:disabled { opacity:.5; cursor:not-allowed; }

  .divider { display:flex; align-items:center; gap:16px; margin:28px 0; color:var(--d); font-size:12px; letter-spacing:.15em; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:linear-gradient(to right,transparent,#333,transparent); }

  form { display:flex; flex-direction:column; gap:12px; }
  .field { height:52px; background:var(--s1); border:1px solid var(--b); border-radius:12px; padding:0 16px; display:flex; align-items:center; gap:12px; transition:border-color .2s; }
  .field:focus-within { border-color:#666; }
  .field svg { flex-shrink:0; color:var(--m); }
  .field .pre { font-family:"Geist Mono",ui-monospace,monospace; font-size:15px; color:#5c5c5c; white-space:nowrap; }
  .field .pre b { color:#fff; font-weight:500; }
  #usernameWrap { gap:0; }
  #username { font-family:"Geist Mono",ui-monospace,monospace; padding-left:1px; }
  .field input { flex:1; height:100%; background:none; border:0; outline:0; font-size:15px; min-width:0; }
  .field input::placeholder { color:#666; }
  .eye { background:none; border:0; cursor:pointer; color:var(--m); display:grid; place-items:center; }
  .hint { font-size:12px; color:var(--d); margin:-4px 0 4px 4px; }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus { -webkit-box-shadow:0 0 0 1000px #0d0d0d inset !important; -webkit-text-fill-color:#fff !important; caret-color:#fff; transition:background-color 9999s ease-out 0s; }

  .primary { margin-top:12px; height:52px; width:100%; border:0; border-radius:999px; background:#fff; color:#000; font-weight:600; font-size:16px; cursor:pointer; transition:opacity .2s,transform .1s; }
  .primary:hover { opacity:.9; }
  .primary:active { transform:scale(.99); }
  .primary:disabled { opacity:.5; cursor:wait; }

  .status { display:none; margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.4; border:1px solid #333; background:var(--s1); color:#ddd; }
  .status.show { display:block; }
  .status.err { border-color:#5a2a2a; background:#140a0a; color:#f2b8b8; }

  .footer { position:relative; z-index:1; text-align:center; font-size:12px; color:var(--d); margin-top:48px; padding-bottom:8px; }
  .loading { position:fixed; inset:0; display:grid; place-items:center; color:var(--d); font-size:14px; z-index:2; background:#000; }
</style>
</head>
<body>

<div class="lava"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="loading" id="loading">Loading…</div>

<section class="auth hidden" id="auth">
  <div class="wrap">
    <a class="logo" href="index.html">sigari<span>.bio</span></a>
    <a class="back" href="index.html">&larr; Back to home</a>
    <h1 id="authTitle">Claim your @.</h1>
    <p class="sub" id="authSub">Already have an account? <a id="toggleMode">Log in</a></p>

    <div class="social">
      <button class="btn-ghost" id="btnDiscord" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.4a18.3 18.3 0 0 0-6.4 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 -.2 13.5.2 18a19.9 19.9 0 0 0 6 3l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4a12.8 12.8 0 0 1-2 1L16.8 21a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.6-2.5-13.6zM8.5 15.4c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4z"/></svg>
        Discord
      </button>
      <button class="btn-ghost" id="btnGoogle" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.6 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.96S8.78 6.26 12 6.26c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.7 3.7 14.6 2.8 12 2.8 6.92 2.8 2.8 6.92 2.8 12s4.12 9.2 9.2 9.2c5.31 0 8.83-3.73 8.83-8.99 0-.6-.07-1.06-.15-1.51z"/></svg>
        Google
      </button>
    </div>

    <div class="divider">OR WITH EMAIL</div>

    <form id="authForm" novalidate>
      <div class="field" id="usernameWrap"><span class="pre">sigari.bio/<b>@</b></span><input id="username" type="text" placeholder="yourname" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20" aria-label="Username"></div>
      <div class="hint" id="usernameHint">Claimed now. Unlocked when you're let in.</div>

      <div class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
      </div>

      <div class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="password" type="password" placeholder="Password" autocomplete="new-password">
        <button class="eye" type="button" data-target="password" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <div class="field" id="confirmWrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="confirm" type="password" placeholder="Confirm password" autocomplete="new-password">
        <button class="eye" type="button" data-target="confirm" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <button class="primary" id="submitBtn" type="submit">Sign up &rarr;</button>
    </form>

    <div class="status" id="authStatus"></div>
  </div>

  <footer class="footer">Built by the devs at Sigari &amp; Gin, all rights reserved.</footer>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, OAuthProvider,
    createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, doc, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRVxG-AaLh7nCevtUxqmbkPVk3I4dWAMg",
    authDomain: "sigari-bio-52324.firebaseapp.com",
    projectId: "sigari-bio-52324",
    storageBucket: "sigari-bio-52324.firebasestorage.app",
    messagingSenderId: "265808515501",
    appId: "1:265808515501:web:0395a4c9bc3522a1bd1124",
    measurementId: "G-Q2PEC2D88K"
  };

  const DISCORD_ENABLED = false;
  const DISCORD_PROVIDER_ID = "oidc.discord";
  const DEFAULT_APPEARANCE = { theme: "pure", effect: "lava", intensity: 80, cursor: "default", buttons: { variant: "solid", palette: "white", shape: "rounded", shadow: "none", hover: "none" } };
  const DEFAULT_LINKS = [
    { title: "Latest release", url: "#" },
    { title: "Portfolio", url: "#" },
    { title: "Contact", url: "#" }
  ];
  const HANDLE_RE = /^[a-z0-9_]{3,20}$/;

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let mode = "signup";
  const $ = id => document.getElementById(id);

  function setStatus(msg, type = "") {
    const el = $("authStatus");
    el.textContent = msg;
    el.className = "status" + (msg ? " show " + type : "");
  }
  const authErr = msg => setStatus(msg, "err");

  function setBusy(busy) {
    $("submitBtn").disabled = busy;
    $("btnGoogle").disabled = busy;
    $("btnDiscord").disabled = busy;
  }

  function friendly(err) {
    const map = {
      "auth/email-already-in-use": "This email already has an account. Try logging in.",
      "auth/invalid-credential": "Wrong email or password.",
      "auth/invalid-email": "That email address looks invalid.",
      "auth/weak-password": "Password must be at least 8 characters.",
      "auth/popup-closed-by-user": "Sign-in was cancelled.",
      "auth/account-exists-with-different-credential": "This email is already linked to another sign-in method.",
      "auth/network-request-failed": "Network error. Check your connection.",
      "USERNAME_TAKEN": "That username is already claimed."
    };
    return map[err.code] || map[err.message] || err.message || "Something went wrong.";
  }

  function setMode(m) {
    mode = m;
    const signup = m === "signup";
    $("authTitle").textContent = signup ? "Claim your @." : "Welcome back.";
    $("authSub").firstChild.textContent = signup ? "Already have an account? " : "New here? ";
    $("toggleMode").textContent = signup ? "Log in" : "Sign up";
    $("usernameWrap").classList.toggle("hidden", !signup);
    $("usernameHint").classList.toggle("hidden", !signup);
    $("confirmWrap").classList.toggle("hidden", !signup);
    $("submitBtn").innerHTML = signup ? "Sign up &rarr;" : "Log in &rarr;";
    $("authStatus").className = "status";
  }

  // Creates the username reservation and the user profile in one transaction.
  async function claimHandle(uid, handle, extra) {
    await runTransaction(db, async tx => {
      const handleRef = doc(db, "usernames", handle);
      const snap = await tx.get(handleRef);
      if (snap.exists()) throw new Error("USERNAME_TAKEN");
      tx.set(handleRef, { uid, createdAt: serverTimestamp() });
      tx.set(doc(db, "users", uid), {
        handle,
        ...extra,
        displayName: handle,
        bio: "discord.gg/sigari",
        tags: ["dark", "tech", "minimal"],
        avatarUrl: null,
        appearance: DEFAULT_APPEARANCE,
        links: DEFAULT_LINKS,
        plan: "free",
        createdAt: serverTimestamp()
      }, { merge: true });
    });
  }

  // Goes to the dashboard only when the user has a profile in Firestore.
  async function redirectIfReady(user) {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      location.replace("dashboard.html");
      return true;
    }
    return false;
  }

  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const handle = $("username").value.trim().toLowerCase();
    const email = $("email").value.trim();
    const pw = $("password").value;
    const pw2 = $("confirm").value;

    if (mode === "signup") {
      if (!HANDLE_RE.test(handle)) return authErr("Username: 3 to 20 letters, numbers or underscores.");
      if (!email) return authErr("Enter your email.");
      if (pw.length < 8) return authErr("Password must be at least 8 characters.");
      if (pw !== pw2) return authErr("Passwords do not match.");
    } else if (!email || !pw) {
      return authErr("Enter your email and password.");
    }

    setBusy(true);
    try {
      if (mode === "signup") {
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        try {
          await claimHandle(cred.user.uid, handle, { email, provider: "password" });
        } catch (err) {
          await deleteUser(cred.user);
          throw err;
        }
        location.replace("dashboard.html");
      } else {
        await signInWithEmailAndPassword(auth, email, pw);
        // onAuthStateChanged handles the redirect
      }
    } catch (err) {
      authErr(friendly(err));
    } finally {
      setBusy(false);
    }
  });

  async function oauthSignIn(provider) {
    const handle = $("username").value.trim().toLowerCase();
    setBusy(true);
    try {
      const cred = await signInWithPopup(auth, provider);
      const exists = (await getDoc(doc(db, "users", cred.user.uid))).exists();
      if (!exists) {
        if (!HANDLE_RE.test(handle)) {
          await signOut(auth);
          throw new Error("Choose a username first, then continue with this provider.");
        }
        try {
          await claimHandle(cred.user.uid, handle, { email: cred.user.email || null, provider: provider.providerId });
        } catch (err) {
          await deleteUser(cred.user);
          throw err;
        }
      }
      location.replace("dashboard.html");
    } catch (err) {
      authErr(friendly(err));
    } finally {
      setBusy(false);
    }
  }

  $("btnGoogle").addEventListener("click", () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    oauthSignIn(provider);
  });

  $("btnDiscord").addEventListener("click", () => {
    if (!DISCORD_ENABLED) return authErr("Discord login is not configured yet.");
    const provider = new OAuthProvider(DISCORD_PROVIDER_ID);
    provider.addScope("identify");
    provider.addScope("email");
    oauthSignIn(provider);
  });

  // Already signed in with a profile? Skip the form and go straight to the dashboard.
  onAuthStateChanged(auth, async user => {
    if (user && await redirectIfReady(user)) return;
    $("loading").classList.add("hidden");
    $("auth").classList.remove("hidden");
  });

  $("toggleMode").addEventListener("click", e => {
    e.preventDefault();
    setMode(mode === "signup" ? "login" : "signup");
  });

  document.querySelectorAll(".eye").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = $(btn.dataset.target);
      input.type = input.type === "password" ? "text" : "password";
    });
  });

  // Coming from the landing page: ?handle=name prefills the @, ?mode=login opens the login form.
  const params = new URLSearchParams(location.search);
  setMode(params.get("mode") === "login" ? "login" : "signup");
  const preset = (params.get("handle") || "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 20);
  if (preset) {
    $("username").value = preset;
    $("authTitle").textContent = "Claim @" + preset + ".";
    $("usernameHint").textContent = "Finish signing up to lock it.";
  }
  $("username").addEventListener("input", e => {
    const v = e.target.value.toLowerCase().replace(/^@+/, "").replace(/[^a-z0-9_]/g, "");
    if (v !== e.target.value) e.target.value = v;
  });
</script>
</body>
</html>
