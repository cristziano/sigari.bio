<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paste · 404.bio</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; color:#fff; font-family:"Geist",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .top { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid #1d1d1d; }
  .logo { font-weight:600; font-size:18px; letter-spacing:-.02em; text-decoration:none; }
  .logo span { color:#666; }
  main { max-width:980px; margin:0 auto; padding:36px 24px 80px; }
  h1 { font-size:clamp(26px, 4vw, 40px); letter-spacing:-.04em; overflow-wrap:anywhere; }
  .meta { margin-top:8px; color:#777; font:400 12.5px "Geist Mono",monospace; }
  .meta a { color:#ccc; }
  .row { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  button { height:36px; padding:0 14px; border-radius:999px; border:1px solid #333; background:none; color:#fff; cursor:pointer; font:500 13px "Geist",sans-serif; }
  button.main { background:#fff; color:#000; border-color:#fff; }
  .code { margin-top:18px; border:1px solid #1f1f1f; border-radius:14px; background:#070707; overflow:auto; counter-reset:l; }
  .code div { display:flex; font:400 13px/1.6 "Geist Mono",monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .code div::before { counter-increment:l; content:counter(l); flex:0 0 46px; text-align:right; padding-right:14px; color:#444; user-select:none; }
  .code div:first-child { padding-top:12px; } .code div:last-child { padding-bottom:12px; }
  .note { color:#777; font:400 13px "Geist Mono",monospace; }
  @media (max-width:520px) { main { padding:26px 14px 60px; } .code div::before { flex-basis:32px; padding-right:10px; } }
</style>
</head>
<body>
<header class="top"><a class="logo" href="/">404<span>.bio</span></a></header>
<main id="main"><p class="note">Carico…</p></main>
<script type="module">
  const $ = id => document.getElementById(id);
  const firebaseConfig = { apiKey: "AIzaSyCRVxG-AaLh7nCevtUxqmbkPVk3I4dWAMg", authDomain: "sigari-bio-52324.firebaseapp.com", projectId: "sigari-bio-52324", storageBucket: "sigari-bio-52324.firebasestorage.app", messagingSenderId: "265808515501", appId: "1:265808515501:web:0395a4c9bc3522a1bd1124" };
  const profileUrl = h => /^(localhost|127\.)/.test(location.hostname) ? `profile.html?u=${h}` : `/${h}`;
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const id = (new URLSearchParams(location.search).get("id") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 40);
  (async () => {
    const main = $("main");
    if (!id) return main.replaceChildren(el("h1", null, "Paste non trovato"), el("p", "meta", "Questo link non porta a nessun testo."));
    try {
      const base = "https://www.gstatic.com/firebasejs/10.12.5/";
      const [{ initializeApp }, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore-lite.js")]);
      const db = F.getFirestore(initializeApp(firebaseConfig));
      const snap = await F.getDoc(F.doc(db, "pastes", id));
      if (!snap.exists()) return main.replaceChildren(el("h1", null, "Paste non trovato"), el("p", "meta", "Forse è stato eliminato da chi l'ha scritto."));
      const p = snap.data(), title = p.title || "Senza titolo";
      document.title = `${title} · 404.bio`;
      const meta = el("p", "meta");
      const who = el("a", null, "@" + p.author); who.href = profileUrl(p.author);
      const date = p.createdAt ? p.createdAt.toDate().toLocaleString("it-IT", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      meta.append("di ", who, ` · ${date} · ${p.text.length.toLocaleString("it-IT")} caratteri`);
      const row = el("div", "row");
      const copy = el("button", "main", "Copia il testo"); copy.type = "button";
      copy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(p.text); copy.textContent = "Copiato"; } catch (_) { copy.textContent = "Selezionalo e copialo a mano"; } });
      const dl = el("button", null, "Scarica .txt"); dl.type = "button";
      dl.addEventListener("click", () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([p.text], { type: "text/plain" })); a.download = title.replace(/[^\w\- ]+/g, "").trim().slice(0, 40) + ".txt"; a.click(); });
      const link = el("button", null, "Copia il link"); link.type = "button";
      link.addEventListener("click", async () => { try { await navigator.clipboard.writeText(location.href); link.textContent = "Copiato"; } catch (_) { /* clipboard blocked */ } });
      row.append(copy, dl, link);
      const code = el("div", "code");
      code.replaceChildren(...p.text.split("\n").map(line => el("div", null, line || " ")));
      main.replaceChildren(el("h1", null, title), meta, row, code);
    } catch (_) { main.replaceChildren(el("p", "note", "Non riesco a caricare. Controlla la connessione e riprova.")); }
  })();
</script>
</body>
</html>
