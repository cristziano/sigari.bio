# Pictures of the profiles for the ring in the home page (sigari-bio/ring/).
# Runs only when started by hand (Actions > "Profili della home" > Run workflow): it opens the most
# visited public profiles, photographs them and, if something changed, saves the new pictures
# (Vercel then publishes them). No secrets needed.
name: Profili della home
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ring
  cancel-in-progress: false
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Pictures
        run: node scripts/ring-shots.mjs
      - name: Save if changed
        run: |
          git config user.name "18kbio bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sigari-bio/ring
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Profili della home: immagini aggiornate"
          git pull --rebase origin main
          git push origin HEAD:main
