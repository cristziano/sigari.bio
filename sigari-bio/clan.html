<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clan · 404.bio</title>
<meta name="description" content="I clan di 404.bio: una TAG riservata, i membri e la classifica.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; color:#fff; font-family:"Geist",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  .top { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px; padding:14px 24px; background:rgba(0,0,0,.8); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid #1d1d1d; }
  .logo { font-weight:600; font-size:18px; letter-spacing:-.02em; }
  .logo span { color:#666; }
  .sp { flex:1; }
  .btn { height:40px; padding:0 16px; border-radius:999px; background:#fff; color:#000; font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; }
  .ghost { height:40px; padding:0 16px; border-radius:999px; border:1px solid #333; font-size:13.5px; display:inline-flex; align-items:center; }
  main { max-width:980px; margin:0 auto; padding:44px 24px 80px; }
  .tag { display:inline-block; font:700 clamp(54px, 12vw, 120px)/.9 "Geist Mono",monospace; letter-spacing:.02em; padding:.08em .18em; border-radius:.12em; background:var(--c,#fff); color:var(--on,#000); }
  h1 { margin-top:22px; font-size:clamp(28px, 5vw, 44px); letter-spacing:-.04em; }
  .desc { margin-top:8px; color:#9a9a9a; max-width:600px; }
  .stats { display:flex; gap:26px; flex-wrap:wrap; margin-top:22px; font:500 13px "Geist Mono",monospace; color:#777; }
  .stats b { display:block; color:#fff; font:700 28px "Geist",sans-serif; letter-spacing:-.03em; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:26px; }
  .label { margin:44px 0 12px; font:500 11px "Geist Mono",monospace; letter-spacing:.08em; color:#666; text-transform:lowercase; }
  .members { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
  .m { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid #1f1f1f; border-radius:14px; background:#0a0a0a; transition:border-color .2s; }
  .m:hover { border-color:#555; }
  .av { width:42px; height:42px; border-radius:50%; background:#1a1a1a; display:grid; place-items:center; font-weight:700; overflow:hidden; flex-shrink:0; }
  .av img { width:100%; height:100%; object-fit:cover; }
  .m b { display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m small { color:#777; font:400 11.5px "Geist Mono",monospace; }
  .crown { color:#f5c542; }
  .lb { display:flex; flex-direction:column; border:1px solid #1f1f1f; border-radius:16px; overflow:hidden; }
  .lb a { display:grid; grid-template-columns:44px auto minmax(0,1fr) auto; gap:14px; align-items:center; padding:14px 18px; border-bottom:1px solid #1a1a1a; background:#0a0a0a; }
  .lb a:last-child { border-bottom:0; }
  .lb a:hover { background:#111; }
  .lb .n { font:500 12px "Geist Mono",monospace; color:#666; }
  .lb .t { font:700 13px "Geist Mono",monospace; padding:4px 8px; border-radius:6px; background:var(--c,#fff); color:var(--on,#000); }
  .lb small { color:#777; font:400 12px "Geist Mono",monospace; }
  .note { color:#777; font:400 13px "Geist Mono",monospace; margin-top:20px; }
  @media (max-width:520px) { main { padding:30px 16px 60px; } .top { padding:12px 16px; } }
</style>
</head>
<body>
<header class="top"><a class="logo" href="/">404<span>.bio</span></a><span class="sp"></span><a href="explore.html" style="font-size:13px;color:#aaa">esplora</a><a class="btn" href="dashboard.html#clans" style="height:36px;font-size:13px">I tuoi clan</a></header>
<main id="main"><p class="note">Carico…</p></main>
<script type="module">
  const $ = id => document.getElementById(id);
  const firebaseConfig = { apiKey: "AIzaSyCRVxG-AaLh7nCevtUxqmbkPVk3I4dWAMg", authDomain: "sigari-bio-52324.firebaseapp.com", projectId: "sigari-bio-52324", storageBucket: "sigari-bio-52324.firebasestorage.app", messagingSenderId: "265808515501", appId: "1:265808515501:web:0395a4c9bc3522a1bd1124" };
  const profileUrl = h => /^(localhost|127\.)/.test(location.hostname) ? `profile.html?u=${h}` : `/${h}`;
  const readable = hex => { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b > .5 ? "#000" : "#fff"; };
  const safeHex = c => /^#[0-9a-f]{6}$/i.test(c || "") ? c : "#ffffff";
  const h = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const tag = (new URLSearchParams(location.search).get("tag") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);

  async function showClan(F, db) {
    const snap = await F.getDoc(F.doc(db, "clans", tag));
    const main = $("main");
    if (!snap.exists()) {
      main.replaceChildren(h("div", "tag", tag), h("h1", null, "Questa TAG è libera."), h("p", "desc", "Nessuno ha ancora creato un clan con questo nome. Può essere il tuo."));
      const row = h("div", "row"); const a = h("a", "btn", "Crea il clan"); a.href = "/dashboard.html#clans"; row.appendChild(a); main.appendChild(row);
      return;
    }
    const c = snap.data(), color = safeHex(c.color);
    document.title = `[${c.tag}] ${c.name} · 404.bio`;
    const t = h("div", "tag", c.tag); t.style.setProperty("--c", color); t.style.setProperty("--on", readable(color));
    const stats = h("div", "stats");
    const stat = (n, l) => { const d = h("div"); const b = h("b", null, n); d.append(b, l); stats.appendChild(d); return b; };
    stat(String(c.members || 0), "membri");
    const viewsB = stat("…", "visite in totale");
    stat("@" + c.owner, "capo");
    const row = h("div", "row");
    const join = h("a", "btn", "Entra nel clan"); join.href = `/dashboard.html?join=${c.tag}#clans`;
    const share = h("button", "ghost", "Copia il link"); share.type = "button"; share.style.background = "none"; share.style.color = "#fff"; share.style.cursor = "pointer";
    share.addEventListener("click", async () => { try { await navigator.clipboard.writeText(location.href); share.textContent = "Copiato"; } catch (_) { share.textContent = location.href; } });
    row.append(join, share);
    const grid = h("div", "members");
    main.replaceChildren(t, h("h1", null, c.name), ...(c.desc ? [h("p", "desc", c.desc)] : []), stats, row, h("div", "label", "membri"), grid);
    const ms = await F.getDocs(F.query(F.collection(db, "clans", tag, "members"), F.limit(60)));
    const profiles = await Promise.all(ms.docs.map(d => F.getDoc(F.doc(db, "profiles", d.id)).then(s => ({ handle: d.id, ...(s.exists() ? s.data() : {}) })).catch(() => ({ handle: d.id }))));
    profiles.sort((a, b) => (b.views || 0) - (a.views || 0));
    viewsB.textContent = profiles.reduce((s, p) => s + (p.views || 0), 0).toLocaleString("it-IT");
    grid.replaceChildren(...profiles.map(p => {
      const a = h("a", "m"); a.href = profileUrl(p.handle);
      const av = h("div", "av");
      if (p.avatarUrl && /^https:/.test(p.avatarUrl)) { const i = document.createElement("img"); i.src = p.avatarUrl; i.alt = ""; av.appendChild(i); } else av.textContent = p.handle[0].toUpperCase();
      const txt = h("div"); txt.style.minWidth = "0";
      const b = h("b", null, p.displayName || p.handle);
      if (p.handle === c.owner) b.prepend(h("span", "crown", "♛ "));
      txt.append(b, h("small", null, `@${p.handle} · ${(p.views || 0).toLocaleString("it-IT")} visite`));
      a.append(av, txt);
      return a;
    }));
  }
  async function showBoard(F, db) {
    const main = $("main");
    const list = h("div", "lb");
    main.replaceChildren(h("h1", null, "Classifica dei clan"), h("p", "desc", "Una TAG da 2 a 4 caratteri, riservata per sempre. Ogni profilo può stare in 3 clan, uno è il principale."), h("div", "label", "per numero di membri"), list);
    const snap = await F.getDocs(F.query(F.collection(db, "clans"), F.orderBy("members", "desc"), F.limit(50)));
    list.replaceChildren(...snap.docs.map((d, i) => {
      const c = d.data(), color = safeHex(c.color);
      const a = h("a"); a.href = "?tag=" + c.tag;
      const t = h("span", "t", c.tag); t.style.setProperty("--c", color); t.style.setProperty("--on", readable(color));
      a.append(h("span", "n", String(i + 1).padStart(2, "0")), t, h("span", null, c.name), h("small", null, `${c.members || 0} membri`));
      return a;
    }));
    if (!snap.size) main.appendChild(h("p", "note", "Ancora nessun clan. Creane uno dalla dashboard."));
  }
  (async () => {
    try {
      const base = "https://www.gstatic.com/firebasejs/10.12.5/";
      const [{ initializeApp }, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore-lite.js")]);
      const db = F.getFirestore(initializeApp(firebaseConfig));
      await (tag.length >= 2 ? showClan(F, db) : showBoard(F, db));
    } catch (_) { $("main").replaceChildren(h("p", "note", "Non riesco a caricare. Controlla la connessione e riprova.")); }
  })();
</script>
</body>
</html>
