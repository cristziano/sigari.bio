<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>18k.bio</title>
<meta name="description" content="Un profilo su 18k.bio">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#000; color:#fff; font-family:"Geist",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  #root { position:fixed; inset:0; }
  .msg[hidden] { display:none; }
  .own-bar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:2147482000; display:flex; align-items:center; gap:12px; padding:8px 8px 8px 16px; border-radius:999px; background:rgba(0,0,0,.78); border:1px solid rgba(255,255,255,.18); color:#fff; font:500 13px system-ui,sans-serif; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); max-width:calc(100vw - 24px); }
  .own-bar a { padding:7px 14px; border-radius:999px; background:#fff; color:#000; text-decoration:none; font-weight:600; flex:none; }
  .msg { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px; }
  .msg h1 { font-size:clamp(34px, 7vw, 64px); letter-spacing:-.05em; line-height:1; }
  .msg p { margin-top:14px; color:#8f8f8f; font-size:15px; }
  .msg a { display:inline-flex; align-items:center; height:44px; padding:0 18px; margin-top:22px; border-radius:10px; background:#fff; color:#000; font-weight:600; text-decoration:none; }
  /* like and "crea il tuo profilo" side by side at the bottom, never on top of each other */
  .dock { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:31; display:flex; align-items:center; gap:8px; max-width:calc(100vw - 24px); }
  .brand { position:relative; height:42px; box-sizing:border-box; display:flex; align-items:center; gap:8px; font:600 12.5px "Geist",system-ui,sans-serif; color:#fff; text-decoration:none; padding:8px 14px 8px 12px; border-radius:99px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:transform .2s, background .2s; white-space:nowrap; }
  .brand:hover { transform:translateY(-2px); background:rgba(0,0,0,.75); }
  .brand i { font-style:normal; font-weight:700; letter-spacing:-.02em; }
  .brand span { color:rgba(255,255,255,.65); font-weight:500; }
  .hidden { display:none !important; }
  .report-btn { position:relative; flex:none; height:30px; border:0; font:500 11px "Geist Mono",monospace; color:rgba(255,255,255,.4); padding:5px 10px; border-radius:99px; background:rgba(0,0,0,.35); cursor:pointer; }
  .report-btn:hover { color:#fff; }
  .like-btn { position:relative; flex:none; display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 18px 0 14px; border-radius:999px; border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:#fff; font:600 14px "Geist",system-ui,sans-serif; cursor:pointer; transition:transform .2s, background .2s, border-color .2s; -webkit-tap-highlight-color:transparent; }
  .like-btn:hover { border-color:rgba(255,255,255,.45); }
  .like-btn .lh { display:inline-flex; color:rgba(255,255,255,.75); transition:transform .25s, color .2s; }
  .like-btn .lh svg { width:18px; height:18px; }
  .like-btn[aria-pressed="true"] { background:#fff; color:#000; border-color:#fff; }
  .like-btn[aria-pressed="true"] .lh { color:#ff2d55; }
  .like-btn.pop .lh { transform:scale(1.35); }
  .like-btn:disabled { opacity:.6; cursor:default; }
  .like-tip { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:31; padding:9px 14px; border-radius:12px; background:#111; border:1px solid #2c2c2c; color:#ddd; font:400 13px "Geist",system-ui,sans-serif; white-space:nowrap; }
  .like-tip a { color:#fff; font-weight:600; }
  .like-btn.hidden, .like-tip.hidden { display:none; }
  @media (max-width:380px) { .brand span { display:none; } }
  @media (prefers-reduced-motion: reduce) { .like-btn, .like-btn .lh { transition:none; } }
  .report { margin:auto; border:1px solid #2a2a2a; border-radius:16px; background:#0b0b0b; color:#f2f2f2; padding:18px; width:min(380px,92vw); }
  .report::backdrop { background:rgba(0,0,0,.7); }
  .report form { display:grid; gap:10px; font:14px "Geist",system-ui,sans-serif; }
  .report select, .report textarea { width:100%; border:1px solid #2a2a2a; border-radius:10px; background:#000; color:#f2f2f2; padding:10px; font:inherit; }
  .report textarea { min-height:80px; resize:vertical; }
  .report-row { display:flex; gap:8px; justify-content:flex-end; }
  .report-row button { border:1px solid #2a2a2a; border-radius:99px; background:none; color:#f2f2f2; padding:8px 14px; cursor:pointer; font:inherit; }
  .report-row button[type=submit] { background:#fff; color:#000; border-color:#fff; }
  .report small { color:#9a9a9a; min-height:1em; }
  .loading { color:#555; font:400 13px "Geist Mono",monospace; }
</style>
<script src="alert.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="root"></div>
<div class="msg" id="msg"><span class="loading">caricamento…</span></div>
<div class="dock"><a class="brand" href="/" id="brand" aria-label="Vai a 18k.bio e crea il tuo profilo"><i>18k.bio</i><span>· crea il tuo profilo →</span></a>
<button class="like-btn hidden" id="likeBtn" type="button" aria-pressed="false" aria-label="Metti like"><span class="lh"></span><b id="likeN">0</b></button><button class="report-btn hidden" id="reportBtn" type="button">segnala</button></div>
<div class="like-tip hidden" id="likeTip">Accedi per mettere like. <a id="likeLogin" href="/login.html">Accedi</a></div>
<dialog class="report" id="reportDlg">
  <form method="dialog" id="reportForm">
    <b>Segnala questo profilo</b>
    <select id="reportReason" required>
      <option value="">Perché?</option>
      <option value="spam">Spam o truffa</option>
      <option value="falso">Si finge un'altra persona</option>
      <option value="offensivo">Offensivo o d'odio</option>
      <option value="illegale">Contenuti illegali</option>
      <option value="minori">Mette in pericolo dei minori</option>
      <option value="altro">Altro</option>
    </select>
    <textarea id="reportText" maxlength="500" placeholder="Dettagli (facoltativo)"></textarea>
    <div class="report-row"><button type="button" id="reportCancel">Annulla</button><button type="submit" id="reportSend">Invia</button></div>
    <small id="reportOut"></small>
  </form>
</dialog>

<script type="module">
  import { mountProfile, normalizeProfile } from "./profile-kit.js";
  import { hasLiked, setLike, loginUrl, HEART } from "./likes.js";

  const msg = document.getElementById("msg");
  const show = (title, text, cta) => {
    msg.innerHTML = "";
    const box = document.createElement("div");
    const h = document.createElement("h1"); h.textContent = title;
    const p = document.createElement("p"); p.textContent = text;
    box.append(h, p);
    if (cta) { const a = document.createElement("a"); a.href = cta[1]; a.textContent = cta[0]; box.appendChild(a); }
    msg.appendChild(box);
    msg.hidden = false;
  };

  // /@nyx on Vercel, or profile.html?u=nyx anywhere else
  const fromPath = decodeURIComponent(location.pathname).match(/\/@?([a-z0-9_]{1,20})\/?$/i);
  const handle = ((fromPath && fromPath[1]) || new URLSearchParams(location.search).get("u") || "").toLowerCase().replace(/[^a-z0-9_]/g, "");

  const firebaseConfig = {
    apiKey: "AIzaSyCoT9dNoX36cQfvOHDn2d-d-N2_m_MdMzM",
    authDomain: "kbio-c6126.firebaseapp.com",
    projectId: "kbio-c6126",
    storageBucket: "kbio-c6126.firebasestorage.app",
    messagingSenderId: "723958775593",
    appId: "1:723958775593:web:096992d3c8460351d3c138"
  };

  function animateTitle(text) {
    const chars = [...text];
    let i = 0, dir = 1;
    setInterval(() => {
      i += dir;
      if (i >= chars.length) { dir = -1; i = chars.length; }
      if (i <= 1) dir = 1;
      document.title = chars.slice(0, Math.max(1, i)).join("") || text;
    }, 260);
  }

  (async () => {
    if (!handle) return show("Profilo non trovato", "Questo link non porta a nessun profilo.", ["Vai a 18k.bio", "/"]);
    let lite;
    try {
      const base = "https://www.gstatic.com/firebasejs/10.12.5/";
      const [{ initializeApp }, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore-lite.js")]);
      const app = initializeApp(firebaseConfig);
      const db = F.getFirestore(app);
      lite = { F, db, app };
    } catch (_) {
      return show("Non riesco a caricare", "Controlla la connessione e ricarica la pagina.");
    }
    const { F, db } = lite;
    const ref = F.doc(db, "profiles", handle);
    // Who is looking (only loaded when needed): the owner sees their own profile even when it is not public
    let authP = null;
    const currentUser = () => authP || (authP = import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js").then(A => new Promise(res => {
      const auth = A.getAuth(lite.app);
      const off = A.onAuthStateChanged(auth, u => { off(); res(u); });
    })));
    const ownerDraft = async () => {
      try {
        const u = await currentUser();
        if (!u) return null;
        const me = await F.getDoc(F.doc(db, "users", u.uid));
        return me.exists() && me.data().handle === handle ? me.data() : null;
      } catch (_) { return null; }
    };
    let preview = false;
    let snap;
    try { snap = await F.getDoc(ref); }
    catch (_) { return show("Non riesco a caricare", "Il profilo non è raggiungibile adesso. Riprova tra poco."); }

    let data = snap.exists() ? snap.data() : null;
    // Not public (never published, draft, disabled, private): its owner still sees a preview
    if (!data || data.draft || data.disabled || data.private) {
      const own = await ownerDraft();
      if (own) { data = { ...own, views: data && data.views || 0, likes: data && data.likes || 0, badges: data && data.badges || [] }; preview = true; }
    }

    if (!data) {
      // Not published yet, or an extra name that points to another profile
      let taken = false;
      try {
        const u = await F.getDoc(F.doc(db, "usernames", handle));
        taken = u.exists();
        const alias = taken && u.data().aliasOf;
        if (alias && /^[a-z0-9_]{1,20}$/.test(alias)) return location.replace(fromPath ? "/" + alias + location.search : "?u=" + alias);
      } catch (_) { /* unknown */ }
      return taken
        ? show("@" + handle, "Questo profilo non è ancora online.", ["Vai a 18k.bio", "/"])
        : show("@" + handle + " è libera", "Nessuno l'ha ancora presa. Può essere tua.", ["Prendila", "/login.html?handle=" + encodeURIComponent(handle)]);
    }
    if (!preview && data.disabled) return show("Account disattivato", "@" + handle + " ha messo in pausa il suo profilo.", ["Vai a 18k.bio", "/"]);
    if (!preview && data.draft) return show("@" + handle, "Questo profilo non è ancora online.", ["Vai a 18k.bio", "/"]);
    if (!preview && data.private) return show("Profilo privato", "@" + handle + " ha scelto di non mostrare il profilo.", ["Vai a 18k.bio", "/"]);

    msg.hidden = true;
    const p = normalizeProfile({ ...data, handle });
    const a = p.appearance;
    const title = a.title.text || `${p.displayName} · 18k.bio`;
    document.title = title;
    if (a.title.animated && !matchMedia("(prefers-reduced-motion: reduce)").matches) animateTitle(title);
    const desc = a.seo.description || p.bio;
    if (desc) document.querySelector('meta[name="description"]').content = desc;
    document.querySelector('meta[name="theme-color"]').content = a.bg.color;
    if (p.avatarUrl && !p.avatarUrl.startsWith("data:")) {
      const icon = document.createElement("link"); icon.rel = "icon"; icon.href = p.avatarUrl; document.head.appendChild(icon);
    }
    // Daily counters for the owner's statistics: one write can add 1 to up to four keys
    const KEY = /^(v|p|c_[a-z0-9]{4,10}|s_[a-z]{1,16}|r_[a-z0-9]{1,16}|d_[a-z]{1,8}|z_[A-Za-z_]{1,24}|t_[0-9])$/;
    const statRef = F.doc(db, "stats", handle, "days", new Date().toISOString().slice(0, 10));
    const bump = keys => {
      const ks = [...new Set(keys)].filter(k => KEY.test(k)).slice(0, 4);
      if (!ks.length) return;
      const data = { ks };
      ks.forEach(k => { data[k] = F.increment(1); });
      F.setDoc(statRef, data, { merge: true }).catch(() => { /* rules not deployed yet */ });
    };
    const played = new Set();
    const onEvent = (kind, key) => {
      if (kind === "c") bump(["c_" + key]);
      if (kind === "s") bump(["s_" + key]);
      if (kind === "p" && !played.size) { played.add(1); bump(["p"]); }
    };

    // Contact form, newsletter and guestbook write to the owner's inbox
    const actions = {
      contact: d => F.addDoc(F.collection(db, "inbox", handle, "messages"), { name: d.name.slice(0, 60), contact: d.contact.slice(0, 120), text: d.text.slice(0, 1000), createdAt: F.serverTimestamp() }),
      subscribe: email => F.setDoc(F.doc(db, "inbox", handle, "subscribers", email), { email, createdAt: F.serverTimestamp() }),
      guestbook: {
        async list() {
          const snap = await F.getDocs(F.query(F.collection(db, "guestbook", handle, "entries"), F.orderBy("createdAt", "desc"), F.limit(30)));
          return snap.docs.map(d => { const g = d.data(); return { author: g.author, text: g.text, date: g.createdAt ? g.createdAt.toDate().toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "" }; });
        },
        async sign(text) {
          const u = await currentUser();
          if (!u) throw { login: true };
          const me = await F.getDoc(F.doc(db, "users", u.uid));
          if (!me.exists()) throw { login: true };
          await F.addDoc(F.collection(db, "guestbook", handle, "entries"), { uid: u.uid, author: me.data().handle, text: text.slice(0, 200), createdAt: F.serverTimestamp() });
        }
      }
    };
    if (preview) {
      // Only the owner sees this: no counters, no likes, a bar that says it is not online
      mountProfile(document.getElementById("root"), p, { preview: false, onEvent: () => {}, actions: {} });
      const bar = document.createElement("div");
      bar.className = "own-bar";
      bar.innerHTML = `<span><b>Anteprima</b> · solo tu la vedi, il profilo non è online</span><a href="/dashboard.html#publish">Pubblica</a>`;
      document.body.appendChild(bar);
      return;
    }
    mountProfile(document.getElementById("root"), p, { preview: false, onEvent, actions });
    // Like: one per account, the count is on the public document
    const lb = document.getElementById("likeBtn"), ln = document.getElementById("likeN"), tip = document.getElementById("likeTip");
    let likes = p.likes, liked = false, busy = false;
    const paintLike = () => { ln.textContent = likes.toLocaleString("it-IT"); lb.setAttribute("aria-pressed", String(liked)); lb.setAttribute("aria-label", liked ? "Togli il like" : "Metti like"); };
    lb.querySelector(".lh").innerHTML = HEART;
    paintLike(); lb.classList.remove("hidden");
    hasLiked(F, db, lite.app, handle).then(v => { liked = v; paintLike(); });
    lb.addEventListener("click", async () => {
      if (busy) return;
      busy = true; lb.disabled = true;
      const on = !liked;
      liked = on; likes = Math.max(0, likes + (on ? 1 : -1)); paintLike();
      if (on) { lb.classList.add("pop"); setTimeout(() => lb.classList.remove("pop"), 260); }
      try { await setLike(F, db, lite.app, handle, on); }
      catch (err) {
        liked = !on; likes = Math.max(0, likes + (on ? -1 : 1)); paintLike();
        if (err && err.login) { document.getElementById("likeLogin").href = loginUrl(); tip.classList.remove("hidden"); setTimeout(() => tip.classList.add("hidden"), 5000); }
      }
      busy = false; lb.disabled = false;
    });
    // "segnala": goes to the reports collection, which only staff read
    const rb = document.getElementById("reportBtn"), dlg = document.getElementById("reportDlg");
    rb.classList.remove("hidden");
    rb.addEventListener("click", () => { document.getElementById("reportOut").textContent = ""; dlg.showModal(); });
    document.getElementById("reportCancel").addEventListener("click", () => dlg.close());
    document.getElementById("reportForm").addEventListener("submit", async e => {
      e.preventDefault();
      const reason = document.getElementById("reportReason").value, out = document.getElementById("reportOut");
      if (!reason) { out.textContent = "Scegli un motivo."; return; }
      if (sessionStorage.getItem("404-report-" + handle)) { out.textContent = "Hai già segnalato questo profilo. Grazie."; return; }
      try {
        await F.addDoc(F.collection(db, "reports"), { handle, reason, text: document.getElementById("reportText").value.trim().slice(0, 500), createdAt: F.serverTimestamp() });
        sessionStorage.setItem("404-report-" + handle, "1");
        out.textContent = "Segnalazione inviata. Grazie, la controlliamo.";
        setTimeout(() => dlg.close(), 1600);
      } catch (_) { out.textContent = "Non riuscito. Puoi scriverci su discord.gg/18k."; }
    });

    // One view per browser session; the rules only allow +1 on this field
    const key = "sigari-view-" + handle;
    let counted = false;
    try { counted = sessionStorage.getItem(key) === "1"; } catch (_) { /* storage blocked */ }
    if (!counted) {
      try { sessionStorage.setItem(key, "1"); } catch (_) { /* storage blocked */ }
      const qs = new URLSearchParams(location.search);
      const REFS = [[/(^|\.)instagram\.com$/, "instagram"], [/(^|\.)tiktok\.com$/, "tiktok"], [/(^|\.)(discord\.com|discordapp\.com|discord\.gg)$/, "discord"], [/(^|\.)(t\.co|twitter\.com|x\.com)$/, "x"], [/(^|\.)(youtube\.com|youtu\.be)$/, "youtube"], [/(^|\.)google\./, "google"], [/whatsapp/, "whatsapp"], [/(^|\.)(t\.me|telegram\.org)$/, "telegram"], [/reddit\.com$/, "reddit"], [/twitch\.tv$/, "twitch"], [/snapchat\.com$/, "snapchat"], [/(facebook\.com|fb\.com|fb\.me)$/, "facebook"], [/spotify\.com$/, "spotify"]];
      let src = (qs.get("utm_source") || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 16);
      if (!src) {
        let host = "";
        try { host = document.referrer ? new URL(document.referrer).hostname : ""; } catch (_) { host = ""; }
        src = !host ? "diretto" : host === location.hostname ? "sigari" : (REFS.find(([re]) => re.test(host)) || [0, "altro"])[1];
      }
      const coarse = matchMedia("(pointer: coarse)").matches;
      const device = coarse ? (Math.min(screen.width, screen.height) >= 600 ? "tablet" : "mobile") : "desktop";
      let zone = "";
      try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/\//g, "__").replace(/[^A-Za-z_]/g, "").slice(0, 24); } catch (_) { zone = ""; }
      bump(["v", "d_" + device, "r_" + src, zone ? "z_" + zone : ""]);
      // Time on the page, in five buckets, sent once when the visitor leaves or switches tab
      const t0 = performance.now();
      let sent = false;
      const leave = () => {
        if (sent) return;
        sent = true;
        const sec = (performance.now() - t0) / 1000;
        bump(["t_" + (sec < 10 ? 0 : sec < 30 ? 1 : sec < 60 ? 2 : sec < 180 ? 3 : 4)]);
      };
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") leave(); });
      addEventListener("pagehide", leave);
      try { await F.updateDoc(ref, { views: F.increment(1) }); } catch (_) { /* rules not deployed yet */ }
    }
  })();
</script>
</body>
</html>
